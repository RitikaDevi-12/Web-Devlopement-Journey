<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color:beige;
            border: 5ps,solid,rgb(227, 57, 85);
            margin: 2px;
            padding: 2px;
            display: flex;
        }
        .box{
            height: 200px;
            width: 200px;
            border: solid,black,2px;
             margin: 2px;
            padding: 2px;
        }
          #box1{
             background-color: #df6161;
            
        } 
        #box2{
            background-color: #f06cdc;
            

        }
        #box3{
            background-color: #f6a6a6;
           
        } 
        #box4{
            background-color: #3e9ae5;
            
        }
        @media(min-width:640px) {
            .container{
                flex-direction:row;
            }
        }
        @media(max-width:640px){
            .container{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>

    </div>
</body>
</html>
