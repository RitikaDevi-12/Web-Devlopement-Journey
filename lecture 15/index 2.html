<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px,solid,black;
            background-color: bisque;
            display: flex;
            flex-direction: row;
            width: 450px;
            margin: 10px;
            padding: 2px;
        }
        #boxleft{
            background-color: rgb(132, 196, 232);
            border: 2px,solid,rgb(240, 1, 1);
            width: 47%;
            margin: 3px;
            padding: 4px;
            display: flex;
            flex-direction: column;
        }
        #boxright{
            background-color: rgb(229, 229, 39);
            border: 2px,solid,rgb(245, 0, 0);
             width: 47%;
             margin: 3px;
            padding: 4px;
        }
        
        p{
            border: 1px,solid,black;
           
        }   
        @media(max-width:640px){
            .container{
                flex-direction: column;

            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="boxleft">
            <p>Text1</p>
            <p>Text2</p>
        </div>
        <div id="boxright">
            <img src=" WhatsApp Image 2026-09-12 at 6.07.09 PM.jpeg" width="170px" >
        </div>
    </div>
</body>
</html>
