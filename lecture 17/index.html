<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vw;
            background-color: beige;
            border: 5px,solid,black;
        }
        .box1{
            width:350px;
            height: 80px;
            background-color: rgb(101, 101, 205);
            border: 2px,solid,black;
            border-radius: 10px;
            margin: 10px;
            position:relative;
            /* animation-name: rightMovement;
            animation-duration: 5s;
            animation-iteration-count: 1;
            animation-delay: 1s;
            animation-timing-function:linear;
            animation-direction:alternate;
            animation-fill-mode: backwards; */
            animation:5s linear 1s infinite alternate none running rightMovement;
        }
        @keyframes rightMovement {
            from{
                top: 0;
                left:0;

            }

            to{
              top:0;
              left: 900px;
            }
        }
        #box2{
            width:350px;
            height: 80px;
            background-color: rgb(101, 101, 205);
            border: 2px,solid,black;
            border-radius: 10px;
            margin: 10px;
            position:relative;
            animation:5s ease-in 1s infinite alternate none running leftMovement;
        }
         @keyframes leftMovement {
            from{
                top: 300px;
                left:900px;

            }

            to{
              top:300px;
              left: 0px;
            }
        }
        #circle{
            width:90px;
            height: 90px;
            background-color: rgb(109, 192, 209);
            border: 2px,solid,rgb(0, 0, 0);
            border-radius: 50px;
            margin: 10px;
            position:relative;
            top:60px ;
            left:900px ;
            animation:10s ease-in-out 0s infinite alternate-reverse none running circleMovement; 

        }
        @keyframes circleMovement {
          0%{
            top: 1%;
            left: 5%;
          }
          30%{
            top: 5%;
            left: 90%;
          }
          60%{
            top: 70%;
            left: 10%;
          }
          100%{
            top: 75%;
            left: 80%;
          }

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div id="box2"></div>
        <div id="circle"></div>
    </div>
</body>
</html>
