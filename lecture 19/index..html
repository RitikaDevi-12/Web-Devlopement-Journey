<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style> 
    *{
        margin: 0;
        padding: 0;
        box-sizing: border;
    }
        .container{
            width: 100vw;
            height: 100vh;
            min-height: 900px;
            background: conic-gradient(from 210deg, #c5bbb8 0.000deg,  
            #c5bbb8 24.000deg, #b8b5b8 calc(24.000deg + 0.1deg), #b8b5b8 48.000deg, 
            #a9afb7 calc(48.000deg + 0.1deg), #a9afb7 72.000deg, #9aa8b5 calc(72.000deg + 0.1deg),
             #9aa8b5 96.000deg, #8ba1b3 calc(96.000deg + 0.1deg), #8ba1b3 120.000deg,
              #7d98af calc(120.000deg + 0.1deg), #7d98af 144.000deg, #7090ab calc(144.000deg + 0.1deg), 
              #7090ab 168.000deg, #6587a6 calc(168.000deg + 0.1deg), #6587a6 192.000deg,
               #5c7ea1 calc(192.000deg + 0.1deg), #5c7ea1 216.000deg, #55759b calc(216.000deg + 0.1deg), 
               #55759b 240.000deg, #516c94 calc(240.000deg + 0.1deg), #516c94 264.000deg,
                #4f638d calc(264.000deg + 0.1deg), #4f638d 288.000deg, #505a85 calc(288.000deg + 0.1deg),
             #505a85 312.000deg, #54537d calc(312.000deg + 0.1deg), #54537d 336.000deg,
             #5b4b74 calc(336.000deg + 0.1deg) 360.000deg);
             /* background-image:linear-gradient(135deg ,#8bc6ec 0% ,#9599E2 100%); */
             display: flex;
             justify-content: center;
             align-items: center;
        
        }
        .card{
            width: 360px;
            height: 490px;
            background-color: white;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding:20px;

        }
        .card img{
            height: 60%;
            border-radius: 10px ;
            background-color: rgb(95, 153, 201);
        }
        .card h1{
            font-size: 2em;
            font-weight:bold ;
        }
        .card h2{
            font-weight: bold;
            font-size: 2.0remm;
            
        }
        .card p{
            font-weight: bold;
            font-size: 1.2 em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="image qr.webp" alt="">
            <h1 >Scan QR</h1>
            <h2>Improve your Front End skills by developing projects</h2>
            <p>Scan the QR code to visit Front End mentor and take your coding skill to next level</p>

        </div>

    </div>
</body>
</html>
